services:
  vicky:
    build:
      context: .
      dockerfile: src/Dockerfile

    container_name: vicky
    restart: unless-stopped

    env_file:
      - .env

    environment:
      HOST: 0.0.0.0
      HTTP_PORT: 8008
      VICKY_RUNTIME_TOPOLOGY: single-process-local
      WIKI_STORE_FILE_PATH: /vicky-data/wiki-store.json
      WIKI_SSL_STORAGE_DIR: /vicky-data/ssl
      WIKI_ANALYTICS_DB_PATH: /vicky-data/wiki-analytics.sqlite
      AUTH_LOGIN_DB_PATH: /vicky-data/login-rate-limit.sqlite
      WIKI_MARKDOWN_CACHE_DIR: /vicky-cache/markdown-cache
      WIKI_DOCS_SNAPSHOT_DIR: /vicky-cache/docs-cache
      WIKI_TRANSLATION_CACHE_DIR: /vicky-cache/translation-cache
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Ошибка! Переменная AUTH_JWT_SECRET обязательна для заполнения}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Ошибка! Переменная ENCRYPTION_SECRET обязательна для заполнения}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ошибка! Переменная ADMIN_PASSWORD обязательна для заполнения}

    expose:
      - "8008"

    volumes:
      - vicky-data:/vicky-data

    tmpfs:
      - /vicky-cache:size=512m,mode=700

    security_opt:
      - no-new-privileges:true
  nginx:
    image: nginx:1.27-alpine
    container_name: vicky-nginx
    restart: unless-stopped
    depends_on:
      - vicky
    ports:
      - "8008:80"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          location / {
            proxy_pass http://vicky:8008;
            proxy_set_header Host $$http_host;
            proxy_http_version 1.1;
            proxy_cookie_flags ~ nosecure;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
volumes:
  vicky-data:
